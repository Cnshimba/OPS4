<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 Quiz: Node Provisioning & Warewulf (EIOPS4A)</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/theme_v2_modern.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        primary: '#0F172A',
                        secondary: '#38BDF8',
                        accent: '#F59E0B',
                        surface: '#1E293B'
                    }
                }
            }
        }
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('theme-toggle');
            const html = document.documentElement;
            const iconSun = document.getElementById('icon-sun');
            const iconMoon = document.getElementById('icon-moon');

            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                html.classList.add('dark');
                iconSun.classList.remove('hidden');
                iconMoon.classList.add('hidden');
            } else {
                html.classList.remove('dark');
                iconSun.classList.add('hidden');
                iconMoon.classList.remove('hidden');
            }

            themeToggle.addEventListener('click', () => {
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    localStorage.theme = 'light';
                    iconSun.classList.add('hidden');
                    iconMoon.classList.remove('hidden');
                } else {
                    html.classList.add('dark');
                    localStorage.theme = 'dark';
                    iconSun.classList.remove('hidden');
                    iconMoon.classList.add('hidden');
                }
            });
        });
    </script>
</head>
<body class="bg-slate-50 dark:bg-[#070A12] text-slate-700 dark:text-slate-300 min-h-screen pt-20 pb-24 transition-colors duration-300">

    <!-- Top Navigation Bar -->
    <nav class="fixed top-0 left-0 right-0 bg-white/80 dark:bg-[#070A12]/80 backdrop-blur-xl z-50 border-b border-slate-200 dark:border-slate-800/80 transition-colors duration-300">
        <div class="container mx-auto px-4 max-w-5xl h-16 flex items-center justify-between">
            <a href="Week_3_Student_Notes.html" class="flex items-center space-x-2 text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-sky-500 transition-colors no-underline">
                <svg class="w-4 h-4 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span>Back to Student Notes</span>
            </a>
            <div class="flex items-center space-x-4">
                <a href="../index.html" class="text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-sky-500 transition-colors no-underline hidden sm:block">Course Home</a>
                <button id="theme-toggle" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/60 hover:border-amber-500/50 transition-colors">
                    <svg id="icon-sun" class="w-4 h-4 text-amber-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="icon-moon" class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container mx-auto px-4 max-w-4xl">
        
        <!-- Hero Header Card -->
        <div class="flex items-stretch bg-slate-50 dark:bg-slate-800/60 rounded-2xl border border-slate-200 dark:border-slate-700/60 shadow-sm mb-8 overflow-hidden">
            <div class="w-32 flex-shrink-0 flex flex-col items-center justify-center bg-slate-100 dark:bg-slate-900 border-r border-slate-200 dark:border-slate-700/80 p-6">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-500 to-amber-600 border-2 border-sky-400 flex flex-col items-center justify-center shadow-lg shadow-amber-500/20 mb-1">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                </div>
                <span class="text-[10px] font-black text-amber-500 uppercase tracking-widest">QUIZ 03</span>
            </div>
            <div class="flex-1 flex flex-col justify-center p-6">
                <h1 class="text-2xl md:text-3xl font-black text-slate-900 dark:text-white m-0">Week 3 Quiz: Node Provisioning & Warewulf</h1>
                <span class="text-xs font-semibold text-amber-500 mt-1">Stateless Provisioning, VNFS & PXE Network Booting</span>
            </div>
        </div>

        <!-- Quiz Container -->
        <div id="quiz-container" class="space-y-6">
            <!-- Questions injected via JS -->
        </div>

        <!-- Results Card Container -->
        <div id="results-container" class="hidden mt-10 p-8 bg-gradient-to-r from-slate-900 to-indigo-950 text-white rounded-3xl shadow-2xl border border-sky-500/30 text-center space-y-6">
            <h2 class="text-3xl font-black text-white m-0">Quiz Complete!</h2>
            <p class="text-lg text-slate-300 m-0">You scored <span id="score-display" class="font-black text-sky-400 text-2xl">0</span> out of <span id="total-display" class="font-bold text-white text-2xl">0</span>.</p>
            <button onclick="location.reload()" class="px-8 py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-white font-black text-sm transition-all shadow-lg shadow-amber-500/30">
                Retry Quiz
            </button>
        </div>

    </main>

    <script>
        const questions = [
            {
                        "question": "What does PXE stand for?",
                        "options": [
                                    "Preboot Execution Environment",
                                    "Parallel XML Extractor",
                                    "Primary X Server Environment",
                                    "Processor Execution Engine"
                        ],
                        "correct": 0,
                        "explanation": "PXE (Preboot Execution Environment) is an industry standard that allows computers to boot an operating system directly from the network instead of a local disk."
            },
            {
                        "question": "What is the role of DHCP in the network boot process?",
                        "options": [
                                    "It transfers the operating system files.",
                                    "It provides the booting node with an IP address and the location of the boot server.",
                                    "It encrypts the boot image.",
                                    "It formats the local hard drive."
                        ],
                        "correct": 1,
                        "explanation": "DHCP (Dynamic Host Configuration Protocol) assigns an IP address to the node and provides the 'next-server' and boot filename required to start the PXE process."
            },
            {
                        "question": "Which protocol is typically used to transfer the initial bootloader (like pxelinux or iPXE) during a network boot?",
                        "options": [
                                    "HTTP",
                                    "FTP",
                                    "TFTP",
                                    "SSH"
                        ],
                        "correct": 2,
                        "explanation": "TFTP (Trivial File Transfer Protocol) is a simple, UDP-based protocol used to transfer the small initial bootloader because it requires minimal implementation in the network card's firmware."
            },
            {
                        "question": "What is a 'stateless' compute node?",
                        "options": [
                                    "A node that does not have an IP address.",
                                    "A node that boots its OS entirely into RAM from the network, maintaining no persistent local OS state.",
                                    "A node that cannot run MPI jobs.",
                                    "A node that is powered off."
                        ],
                        "correct": 1,
                        "explanation": "Stateless nodes run their OS from a RAM disk. Any changes made to the OS are lost upon reboot, ensuring the node always starts in a known, clean state."
            },
            {
                        "question": "What is the primary function of Warewulf?",
                        "options": [
                                    "To compile parallel code.",
                                    "To schedule jobs on a cluster.",
                                    "To provision and manage operating system images across a cluster of compute nodes.",
                                    "To monitor network traffic."
                        ],
                        "correct": 2,
                        "explanation": "Warewulf is an open-source cluster provisioning system that builds OS images and distributes them to compute nodes over the network."
            },
            {
                        "question": "What is a VNFS in the context of Warewulf?",
                        "options": [
                                    "Virtual Network Firewall System",
                                    "Virtual Node File System - the encapsulated OS image deployed to nodes.",
                                    "Volatile Node Failure State",
                                    "Verified Network File Share"
                        ],
                        "correct": 1,
                        "explanation": "The VNFS is the root filesystem image that Warewulf constructs and serves to the compute nodes during the boot process."
            },
            {
                        "question": "What is the purpose of a 'chroot' environment when building cluster images?",
                        "options": [
                                    "To change the root password.",
                                    "To create an isolated directory tree that acts as a separate root filesystem, allowing you to install and configure software for the nodes without affecting the head node.",
                                    "To compress the filesystem.",
                                    "To encrypt the hard drive."
                        ],
                        "correct": 1,
                        "explanation": "A chroot (change root) allows administrators to build and modify the OS image (the VNFS) in an isolated space on the head node before deploying it."
            },
            {
                        "question": "Why is iPXE often used instead of standard PXE?",
                        "options": [
                                    "It is older and more compatible.",
                                    "It supports booting over HTTP, which is much faster and more reliable than TFTP.",
                                    "It requires no DHCP server.",
                                    "It only works on wireless networks."
                        ],
                        "correct": 1,
                        "explanation": "iPXE extends traditional PXE capabilities, notably adding support for HTTP, which vastly speeds up the transfer of the large OS image compared to TFTP."
            },
            {
                        "question": "What is a major advantage of diskless booting (stateless provisioning)?",
                        "options": [
                                    "Nodes use more power.",
                                    "Every node is guaranteed to run the exact same, synchronized software image.",
                                    "It requires a hard drive in every node.",
                                    "It is immune to network failures."
                        ],
                        "correct": 1,
                        "explanation": "Because all nodes pull their OS from the same master image on the head node, software consistency across the cluster is absolutely guaranteed."
            },
            {
                        "question": "In a Warewulf cluster, what generates the `/etc/hosts` file on the compute nodes?",
                        "options": [
                                    "The user must manually write it on every node.",
                                    "Warewulf dynamically generates it based on its internal node database.",
                                    "It is downloaded from the internet.",
                                    "It is copied from the Windows domain controller."
                        ],
                        "correct": 1,
                        "explanation": "Warewulf acts as the source of truth and automatically generates cluster-wide configuration files like /etc/hosts using templates and its node database."
            },
            {
                        "question": "What does the kernel payload do in the Warewulf boot process?",
                        "options": [
                                    "It compiles C code.",
                                    "It provides the Linux kernel and initial RAM disk (initramfs) necessary to start the OS and mount the VNFS.",
                                    "It schedules jobs.",
                                    "It manages user passwords."
                        ],
                        "correct": 1,
                        "explanation": "The kernel payload is the first piece of Linux executed by the bootloader; it initializes hardware and pulls down the rest of the OS image."
            },
            {
                        "question": "How does Warewulf handle node-specific configurations (like hostnames or IP addresses) if all nodes use the same image?",
                        "options": [
                                    "It relies on users to set them after booting.",
                                    "It uses 'Overlays'\u2014small, dynamically generated file archives applied over the base image at boot time.",
                                    "It creates a completely separate 10GB image for every single node.",
                                    "It doesn't; all nodes have the same hostname."
                        ],
                        "correct": 1,
                        "explanation": "Warewulf uses overlays to inject node-specific files (like network configs or hostnames) into the stateless image right as the node boots."
            },
            {
                        "question": "What is the primary identifier used by the DHCP server to recognize a specific bare-metal compute node?",
                        "options": [
                                    "Its CPU model.",
                                    "Its MAC address.",
                                    "Its hard drive serial number.",
                                    "Its BIOS version."
                        ],
                        "correct": 1,
                        "explanation": "The MAC address is a unique hardware identifier on the network card, used by DHCP and Warewulf to identify the node and assign its specific IP and image."
            },
            {
                        "question": "If a stateless compute node reboots, what happens to temporary files written to `/tmp`?",
                        "options": [
                                    "They are saved to the head node.",
                                    "They are preserved on the local hard drive.",
                                    "They are permanently lost because the filesystem exists only in RAM.",
                                    "They are emailed to the administrator."
                        ],
                        "correct": 2,
                        "explanation": "Stateless nodes run in a RAM disk (tmpfs). A reboot wipes the memory, destroying any local modifications or temporary files."
            },
            {
                        "question": "Why must the head node have two network interfaces in a standard cluster design?",
                        "options": [
                                    "To double the internet speed.",
                                    "One for the public external network, and one for the private internal cluster network.",
                                    "One for Windows and one for Linux.",
                                    "To provide a backup if one cable breaks."
                        ],
                        "correct": 1,
                        "explanation": "The head node bridges the outside world (public IP) and the isolated compute nodes (private network), acting as a gateway and NAT router."
            }
];

        let score = 0;
        let answeredQuestions = 0;

        const quizContainer = document.getElementById('quiz-container');

        questions.forEach((q, index) => {
            const qDiv = document.createElement('div');
            qDiv.className = 'bg-white dark:bg-slate-900/80 p-6 md:p-8 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800 space-y-4';
            
            let optionsHtml = '';
            q.options.forEach((opt, optIndex) => {
                optionsHtml += `
                    <button class="option-btn w-full text-left p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/40 hover:border-sky-500 dark:hover:border-sky-500 hover:bg-sky-50/50 dark:hover:bg-sky-950/20 text-slate-800 dark:text-slate-200 font-medium text-sm transition-all duration-200 flex items-center justify-between" 
                            onclick="checkAnswer(${index}, ${optIndex}, this)">
                        <span>${opt}</span>
                        <span class="status-icon ml-3 flex-shrink-0"></span>
                    </button>
                `;
            });

            qDiv.innerHTML = `
                <div class="flex items-start space-x-3">
                    <span class="px-3 py-1 rounded-lg bg-sky-500/10 text-sky-500 font-black text-xs border border-sky-500/30">Q${index + 1}</span>
                    <h3 class="text-base md:text-lg font-bold text-slate-900 dark:text-white m-0 leading-snug">${q.question}</h3>
                </div>
                <div class="options-container space-y-3 pt-2" id="options-${index}">
                    ${optionsHtml}
                </div>
                <div id="explanation-${index}" class="explanation hidden mt-4 p-4 rounded-xl bg-amber-500/10 border border-amber-500/30 text-slate-700 dark:text-slate-300 text-xs leading-relaxed">
                    <strong class="text-amber-500 block mb-1">Explanation:</strong>
                    ${q.explanation}
                </div>
            `;
            quizContainer.appendChild(qDiv);
        });

        function checkAnswer(questionIndex, selectedOptionIndex, buttonElement) {
            const container = document.getElementById(`options-${questionIndex}`);
            if (container.classList.contains('answered')) return;
            
            container.classList.add('answered');
            const buttons = container.getElementsByTagName('button');
            const correctIndex = questions[questionIndex].correct;

            if (selectedOptionIndex === correctIndex) {
                buttonElement.classList.add('bg-emerald-500/20', 'border-emerald-500', 'text-emerald-400');
                buttonElement.querySelector('.status-icon').innerHTML = '<svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
                score++;
            } else {
                buttonElement.classList.add('bg-rose-500/20', 'border-rose-500', 'text-rose-400');
                buttonElement.querySelector('.status-icon').innerHTML = '<svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
                
                buttons[correctIndex].classList.add('bg-emerald-500/20', 'border-emerald-500', 'text-emerald-400');
                buttons[correctIndex].querySelector('.status-icon').innerHTML = '<svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
            }

            for (let btn of buttons) {
                btn.style.cursor = 'default';
            }

            document.getElementById(`explanation-${questionIndex}`).classList.remove('hidden');
            
            answeredQuestions++;
            if (answeredQuestions === questions.length) {
                setTimeout(showResults, 800);
            }
        }

        function showResults() {
            document.getElementById('results-container').classList.remove('hidden');
            document.getElementById('score-display').textContent = score;
            document.getElementById('total-display').textContent = questions.length;
            document.getElementById('results-container').scrollIntoView({ behavior: 'smooth' });
        }
    </script>

    <!-- Footer -->
    <footer class="text-center text-slate-500 dark:text-slate-400 text-xs py-8 mt-12 border-t border-slate-200 dark:border-slate-800">
        Vaal University of Technology · Department of Electrical Engineering - Computer Systems Engineering · EIOPS4A 2026
    </footer>
