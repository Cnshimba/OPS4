    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>

    <link rel="stylesheet" href="../css/theme_v2_modern.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        primary: '#0F172A',
                        secondary: '#38BDF8',
                        accent: '#F59E0B',
                        surface: '#1E293B'
                    }
                }
            }
        }
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('theme-toggle');
            const html = document.documentElement;
            const iconSun = document.getElementById('icon-sun');
            const iconMoon = document.getElementById('icon-moon');

            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                html.classList.add('dark');
                iconSun.classList.remove('hidden');
                iconMoon.classList.add('hidden');
            } else {
                html.classList.remove('dark');
                iconSun.classList.add('hidden');
                iconMoon.classList.remove('hidden');
            }

            themeToggle.addEventListener('click', () => {
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    localStorage.theme = 'light';
                    iconSun.classList.add('hidden');
                    iconMoon.classList.remove('hidden');
                } else {
                    html.classList.add('dark');
                    localStorage.theme = 'dark';
                    iconSun.classList.remove('hidden');
                    iconMoon.classList.add('hidden');
                }
            });
        });
    </script>
</head>
<body class="bg-slate-50 dark:bg-[#070A12] text-slate-700 dark:text-slate-300 min-h-screen pt-20 pb-24 transition-colors duration-300">

    <!-- Top Navigation Bar -->
    <nav class="fixed top-0 left-0 right-0 bg-white/80 dark:bg-[#070A12]/80 backdrop-blur-xl z-50 border-b border-slate-200 dark:border-slate-800/80 transition-colors duration-300">
        <div class="container mx-auto px-4 max-w-5xl h-16 flex items-center justify-between">
            <a href="Week_8_Student_Notes.html" class="flex items-center space-x-2 text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-sky-500 transition-colors no-underline">
                <svg class="w-4 h-4 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span>Back to Student Notes</span>
            </a>
            <div class="flex items-center space-x-4">
                <a href="../index.html" class="text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-sky-500 transition-colors no-underline hidden sm:block">Course Home</a>
                <button id="theme-toggle" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/60 hover:border-amber-500/50 transition-colors">
                    <svg id="icon-sun" class="w-4 h-4 text-amber-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="icon-moon" class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container mx-auto px-4 max-w-4xl">
        
        <!-- Hero Header Card -->
        <div class="flex items-stretch bg-slate-50 dark:bg-slate-800/60 rounded-2xl border border-slate-200 dark:border-slate-700/60 shadow-sm mb-8 overflow-hidden">
            <div class="w-32 flex-shrink-0 flex flex-col items-center justify-center bg-slate-100 dark:bg-slate-900 border-r border-slate-200 dark:border-slate-700/80 p-6">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-500 to-amber-600 border-2 border-sky-400 flex flex-col items-center justify-center shadow-lg shadow-amber-500/20 mb-1">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                </div>
                <span class="text-[10px] font-black text-amber-500 uppercase tracking-widest">QUIZ 08</span>

            <div class="flex-1 flex flex-col justify-center p-6">
                <h1 class="text-2xl md:text-3xl font-black text-slate-900 dark:text-white m-0">Week 8 Quiz: Advanced Storage Concepts & Parallel I/O</h1>
                <span class="text-xs font-semibold text-amber-500 mt-1">Lustre, BeeGFS, Metadata Servers & MPI-IO</span>
            </div>

        <!-- Quiz Container -->
        <div id="quiz-container" class="space-y-6">
            <!-- Questions injected via JS -->
        </div>

        <!-- Results Card Container -->
        <div id="results-container" class="hidden mt-10 p-8 bg-gradient-to-r from-slate-900 to-indigo-950 text-white rounded-3xl shadow-2xl border border-sky-500/30 text-center space-y-6">
            <h2 class="text-3xl font-black text-white m-0">Quiz Complete!</h2>
            <p class="text-lg text-slate-300 m-0">You scored <span id="score-display" class="font-black text-sky-400 text-2xl">0</span> out of <span id="total-display" class="font-bold text-white text-2xl">0</span>.</p>
            <button onclick="location.reload()" class="px-8 py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-white font-black text-sm transition-all shadow-lg shadow-amber-500/30">
                Retry Quiz
            </button>
        </div>

    </main>

    <script>
        const questions = [
            {
                        "question": "What is the primary difference between Block storage and File storage?",
                        "options": [
                                    "Block storage is accessed over the internet, File storage is local.",
                                    "Block storage provides raw storage volumes without a filesystem, while File storage presents data organized in directories and files.",
                                    "Block storage is only for Windows, File storage is for Linux.",
                                    "There is no difference."
                        ],
                        "correct": 1,
                        "explanation": "Block storage is low-level and accessed by the OS as a raw drive. File storage adds a filesystem layer (like NFS or SMB) so users see files and folders."
            },
            {
                        "question": "Why does standard NFS often become a severe bottleneck in HPC environments?",
                        "options": [
                                    "It does not support Linux.",
                                    "It is a single-server architecture, meaning all data requests from thousands of compute nodes hit one machine, overwhelming its network and disk I/O.",
                                    "It encrypts data too heavily.",
                                    "It cannot store files larger than 4GB."
                        ],
                        "correct": 1,
                        "explanation": "Standard NFS funnels all cluster I/O through a single server. In HPC, concurrent access from many nodes quickly saturates the NFS server's bandwidth."
            },
            {
                        "question": "What does POSIX compliance mean for a file system?",
                        "options": [
                                    "It is free and open-source.",
                                    "It adheres to a standard set of OS interfaces (like open, read, write, close) ensuring compatibility with standard Linux utilities and applications.",
                                    "It guarantees data encryption.",
                                    "It means the file system is specifically designed for GPUs."
                        ],
                        "correct": 1,
                        "explanation": "POSIX defines standard system calls. If a Parallel File System is POSIX compliant, standard commands like 'ls' or 'cp' work without modification."
            },
            {
                        "question": "What is the primary architectural advantage of a Parallel File System (PFS) like Lustre or BeeGFS?",
                        "options": [
                                    "It compresses files more efficiently.",
                                    "It strips data across multiple independent storage servers, allowing clients to read/write fragments in parallel, vastly increasing total bandwidth.",
                                    "It automatically translates code from C to Python.",
                                    "It uses less electricity."
                        ],
                        "correct": 1,
                        "explanation": "By breaking large files into chunks and distributing them across many servers (striping), a PFS allows massive parallel I/O, bypassing single-server bottlenecks."
            },
            {
                        "question": "In a Parallel File System, what is the difference between Metadata and Data?",
                        "options": [
                                    "Metadata is the file contents; Data is the filename.",
                                    "Metadata includes file attributes (name, size, permissions, physical location of stripes); Data is the actual file content.",
                                    "Metadata is for administrators; Data is for users.",
                                    "Metadata is stored in the cloud."
                        ],
                        "correct": 1,
                        "explanation": "Metadata servers manage the directory structure and tell clients where the pieces of a file are located. Storage servers hold the actual bits."
            },
            {
                        "question": "In Lustre architecture, what does MDS stand for?",
                        "options": [
                                    "Main Data Storage",
                                    "Metadata Server",
                                    "Multiple Disk System",
                                    "Memory Direct Sync"
                        ],
                        "correct": 1,
                        "explanation": "The MDS (Metadata Server) manages the namespace and permissions. It stores this metadata on an MDT (Metadata Target)."
            },
            {
                        "question": "In Lustre architecture, what is an OSS?",
                        "options": [
                                    "Open Source Software",
                                    "Object Storage Server",
                                    "Operational State System",
                                    "Optical Storage Switch"
                        ],
                        "correct": 1,
                        "explanation": "The OSS (Object Storage Server) provides file I/O service, storing file data chunks on OSTs (Object Storage Targets)."
            },
            {
                        "question": "BeeGFS is known for its modular architecture. Which of the following is NOT one of its core services?",
                        "options": [
                                    "Management Service",
                                    "Metadata Service",
                                    "Storage Service",
                                    "Rendering Service"
                        ],
                        "correct": 3,
                        "explanation": "BeeGFS consists of the Management, Metadata, Storage, and Client services. Rendering is unrelated to storage."
            },
            {
                        "question": "What does 'Striping' refer to in advanced storage concepts?",
                        "options": [
                                    "Painting lines on the server room floor.",
                                    "Distributing consecutive segments of a file across multiple storage targets to enable parallel I/O.",
                                    "Removing metadata from a file.",
                                    "Compressing a file to save space."
                        ],
                        "correct": 1,
                        "explanation": "Striping splits a file into chunks (e.g., 1MB each) and writes them across different servers, multiplying the read/write performance."
            },
            {
                        "question": "Why is NVMe (Flash) storage heavily preferred for Metadata Servers?",
                        "options": [
                                    "It is cheaper than HDD.",
                                    "Metadata operations involve millions of tiny, random reads and writes (IOPS), which flash handles exponentially better than spinning disks.",
                                    "It looks cooler in the server rack.",
                                    "It is required for POSIX compliance."
                        ],
                        "correct": 1,
                        "explanation": "Metadata workloads are highly random and IOPS-intensive (e.g., checking permissions, listing directories), making the low latency of NVMe critical."
            },
            {
                        "question": "What is Object Storage (like Amazon S3)?",
                        "options": [
                                    "A hierarchical file system.",
                                    "A flat storage architecture where data is managed as objects, each with a unique identifier and rich metadata, accessed via an API.",
                                    "Storage designed specifically for object-oriented programming.",
                                    "A type of local hard drive."
                        ],
                        "correct": 1,
                        "explanation": "Unlike File storage (hierarchical) or Block storage (raw sectors), Object storage uses a flat namespace and HTTP APIs (REST) to store and retrieve data."
            },
            {
                        "question": "What is the difference between Throughput and IOPS?",
                        "options": [
                                    "Throughput measures data volume per second (MB/s); IOPS measures the number of distinct read/write operations per second.",
                                    "They are the exact same thing.",
                                    "Throughput is for CPUs; IOPS is for storage.",
                                    "Throughput measures latency; IOPS measures capacity."
                        ],
                        "correct": 0,
                        "explanation": "Throughput (Bandwidth) is critical for large sequential files (video, big data). IOPS is critical for small, random access (databases, metadata)."
            },
            {
                        "question": "How is High Availability (HA) typically achieved in HPC storage?",
                        "options": [
                                    "By asking users not to delete files.",
                                    "By deploying redundant servers (e.g., Active-Passive pairs) connected to shared dual-ported drives so one can take over if the other fails.",
                                    "By backing everything up to a USB drive nightly.",
                                    "By running the servers at a lower temperature."
                        ],
                        "correct": 1,
                        "explanation": "HA ensures that if an OSS or MDS hardware fails, its partner node immediately takes over its IP address and storage targets without dropping client connections."
            },
            {
                        "question": "What is a 'Quota' in cluster storage?",
                        "options": [
                                    "The maximum number of users allowed to log in.",
                                    "A hard or soft limit enforced by the file system on how much disk space or how many files (inodes) a user or group can consume.",
                                    "The physical speed limit of the network.",
                                    "A daily backup schedule."
                        ],
                        "correct": 1,
                        "explanation": "Quotas prevent a single runaway job or careless user from filling up the entire multi-petabyte shared file system and crashing the cluster."
            },
            {
                        "question": "Why is network bandwidth critical for Parallel File Systems?",
                        "options": [
                                    "Because they run on the public internet.",
                                    "Because the compute nodes must send massive amounts of data over the network to reach the distributed storage servers.",
                                    "Because it downloads software updates.",
                                    "It isn't; CPU speed is more important."
                        ],
                        "correct": 1,
                        "explanation": "In a PFS, the storage is entirely network-attached. The maximum read/write speed of a node is directly limited by its network connection (e.g., Infiniband) to the storage servers."
            }
];

        let score = 0;
        let answeredQuestions = 0;

        const quizContainer = document.getElementById('quiz-container');

        questions.forEach((q, index) => {
            const qDiv = document.createElement('div');
            qDiv.className = 'bg-white dark:bg-slate-900/80 p-6 md:p-8 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800 space-y-4';
            
            let optionsHtml = '';
            q.options.forEach((opt, optIndex) => {
                optionsHtml += `
                    <button class="option-btn w-full text-left p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/40 hover:border-sky-500 dark:hover:border-sky-500 hover:bg-sky-50/50 dark:hover:bg-sky-950/20 text-slate-800 dark:text-slate-200 font-medium text-sm transition-all duration-200 flex items-center justify-between" 
                            onclick="checkAnswer(${index}, ${optIndex}, this)">
                        <span>${opt}</span>
                        <span class="status-icon ml-3 flex-shrink-0"></span>
                    </button>
                `;
            });

            qDiv.innerHTML = `
                <div class="flex items-start space-x-3">
                    <span class="px-3 py-1 rounded-lg bg-sky-500/10 text-sky-500 font-black text-xs border border-sky-500/30">Q${index + 1}</span>
                    <h3 class="text-base md:text-lg font-bold text-slate-900 dark:text-white m-0 leading-snug">${q.question}</h3>
                </div>
                <div class="options-container space-y-3 pt-2" id="options-${index}">
                    ${optionsHtml}
                </div>
                <div id="explanation-${index}" class="explanation hidden mt-4 p-4 rounded-xl bg-amber-500/10 border border-amber-500/30 text-slate-700 dark:text-slate-300 text-xs leading-relaxed">
                    <strong class="text-amber-500 block mb-1">Explanation:</strong>
                    ${q.explanation}
                </div>
            `;
            quizContainer.appendChild(qDiv);
        });

        function checkAnswer(questionIndex, selectedOptionIndex, buttonElement) {
            const container = document.getElementById(`options-${questionIndex}`);
            if (container.classList.contains('answered')) return;
            
            container.classList.add('answered');
            const buttons = container.getElementsByTagName('button');
            const correctIndex = questions[questionIndex].correct;

            if (selectedOptionIndex === correctIndex) {
                buttonElement.classList.add('bg-emerald-500/20', 'border-emerald-500', 'text-emerald-400');
                buttonElement.querySelector('.status-icon').innerHTML = '<svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
                score++;
            } else {
                buttonElement.classList.add('bg-rose-500/20', 'border-rose-500', 'text-rose-400');
                buttonElement.querySelector('.status-icon').innerHTML = '<svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
                
                buttons[correctIndex].classList.add('bg-emerald-500/20', 'border-emerald-500', 'text-emerald-400');
                buttons[correctIndex].querySelector('.status-icon').innerHTML = '<svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
            }

            for (let btn of buttons) {
                btn.style.cursor = 'default';
            }

            document.getElementById(`explanation-${questionIndex}`).classList.remove('hidden');
            
            answeredQuestions++;
            if (answeredQuestions === questions.length) {
                setTimeout(showResults, 800);
            }
        }

        function showResults() {
            document.getElementById('results-container').classList.remove('hidden');
            document.getElementById('score-display').textContent = score;
            document.getElementById('total-display').textContent = questions.length;
            document.getElementById('results-container').scrollIntoView({ behavior: 'smooth' });
        }
    </script>

    <!-- Footer -->
    <footer class="text-center text-slate-500 dark:text-slate-400 text-xs py-8 mt-12 border-t border-slate-200 dark:border-slate-800">
        Vaal University of Technology · Department of Electrical Engineering - Computer Systems Engineering · EIOPS4A 2026
    </footer>

</body>
