<head>
    <meta charset="UTF-8">

    <title>Week 4 Quiz: Resource Management & Slurm (EIOPS4A)</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/theme_v2_modern.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        primary: '#0F172A',
                        secondary: '#38BDF8',
                        accent: '#F59E0B',
                        surface: '#1E293B'
                    }
                }
            }
        }
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('theme-toggle');
            const html = document.documentElement;
            const iconSun = document.getElementById('icon-sun');
            const iconMoon = document.getElementById('icon-moon');

            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                html.classList.add('dark');
                iconSun.classList.remove('hidden');
                iconMoon.classList.add('hidden');
            } else {
                html.classList.remove('dark');
                iconSun.classList.add('hidden');
                iconMoon.classList.remove('hidden');
            }

            themeToggle.addEventListener('click', () => {
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    localStorage.theme = 'light';
                    iconSun.classList.add('hidden');
                    iconMoon.classList.remove('hidden');
                } else {
                    html.classList.add('dark');
                    localStorage.theme = 'dark';
                    iconSun.classList.remove('hidden');
                    iconMoon.classList.add('hidden');
                }
            });
        });
    </script>
</head>
<body class="bg-slate-50 dark:bg-[#070A12] text-slate-700 dark:text-slate-300 min-h-screen pt-20 pb-24 transition-colors duration-300">

    <!-- Top Navigation Bar -->
    <nav class="fixed top-0 left-0 right-0 bg-white/80 dark:bg-[#070A12]/80 backdrop-blur-xl z-50 border-b border-slate-200 dark:border-slate-800/80 transition-colors duration-300">
        <div class="container mx-auto px-4 max-w-5xl h-16 flex items-center justify-between">
            <a href="Week_4_Student_Notes.html" class="flex items-center space-x-2 text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-sky-500 transition-colors no-underline">
                <svg class="w-4 h-4 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span>Back to Student Notes</span>
            </a>
            <div class="flex items-center space-x-4">
                <a href="../index.html" class="text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-sky-500 transition-colors no-underline hidden sm:block">Course Home</a>
                <button id="theme-toggle" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/60 hover:border-amber-500/50 transition-colors">
                    <svg id="icon-sun" class="w-4 h-4 text-amber-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="icon-moon" class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>

    <!-- Main Container -->
    <main class="container mx-auto px-4 max-w-4xl">
        
        <!-- Hero Header Card -->
        <div class="flex items-stretch bg-slate-50 dark:bg-slate-800/60 rounded-2xl border border-slate-200 dark:border-slate-700/60 shadow-sm mb-8 overflow-hidden">
            <div class="w-32 flex-shrink-0 flex flex-col items-center justify-center bg-slate-100 dark:bg-slate-900 border-r border-slate-200 dark:border-slate-700/80 p-6">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-500 to-amber-600 border-2 border-sky-400 flex flex-col items-center justify-center shadow-lg shadow-amber-500/20 mb-1">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                </div>
                <span class="text-[10px] font-black text-amber-500 uppercase tracking-widest">QUIZ 04</span>

            <div class="flex-1 flex flex-col justify-center p-6">
                <h1 class="text-2xl md:text-3xl font-black text-slate-900 dark:text-white m-0">Week 4 Quiz: Resource Management & Slurm</h1>
                <span class="text-xs font-semibold text-amber-500 mt-1">Job Scheduling, Priority Queues & Control Groups</span>
            </div>

        <!-- Quiz Container -->
        <div id="quiz-container" class="space-y-6">
            <!-- Questions injected via JS -->
        </div>

        <!-- Results Card Container -->
        <div id="results-container" class="hidden mt-10 p-8 bg-gradient-to-r from-slate-900 to-indigo-950 text-white rounded-3xl shadow-2xl border border-sky-500/30 text-center space-y-6">
            <h2 class="text-3xl font-black text-white m-0">Quiz Complete!</h2>
            <p class="text-lg text-slate-300 m-0">You scored <span id="score-display" class="font-black text-sky-400 text-2xl">0</span> out of <span id="total-display" class="font-bold text-white text-2xl">0</span>.</p>
            <button onclick="location.reload()" class="px-8 py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-white font-black text-sm transition-all shadow-lg shadow-amber-500/30">
                Retry Quiz
            </button>
        </div>

    </main>

    <script>
        const questions = [
            {
                        "question": "What is the primary purpose of a resource manager/job scheduler like Slurm?",
                        "options": [
                                    "To provision operating systems.",
                                    "To compile C code automatically.",
                                    "To arbitrate access to cluster resources, ensuring fair usage and efficient packing of jobs.",
                                    "To manage user passwords."
                        ],
                        "correct": 2,
                        "explanation": "Slurm manages the queue of user jobs, allocating compute nodes and starting tasks based on policies, priorities, and resource availability."
            },
            {
                        "question": "What does a 'Partition' represent in Slurm?",
                        "options": [
                                    "A division of a hard drive.",
                                    "A logical grouping of compute nodes, often functioning as a specific queue with distinct limits and access controls.",
                                    "A segmented network VLAN.",
                                    "A slice of a CPU core."
                        ],
                        "correct": 1,
                        "explanation": "Partitions in Slurm group nodes together (e.g., 'debug', 'gpu', 'batch') and define job limits like maximum runtime or node count."
            },
            {
                        "question": "Which command is used to submit a batch script to Slurm?",
                        "options": [
                                    "srun",
                                    "sbatch",
                                    "squeue",
                                    "sinfo"
                        ],
                        "correct": 1,
                        "explanation": "The 'sbatch' command parses a submission script, allocates resources, and runs the script in the background when resources become available."
            },
            {
                        "question": "How does 'srun' differ from 'sbatch'?",
                        "options": [
                                    "srun is used for compiling, sbatch is for running.",
                                    "srun submits a background job, sbatch runs interactively.",
                                    "srun executes a command in real-time, often interactively or as a step within a batch script, while sbatch submits a script for later execution.",
                                    "There is no difference."
                        ],
                        "correct": 2,
                        "explanation": "srun launches parallel tasks in real-time across allocated resources, whereas sbatch puts a script into the queue to run unattended."
            },
            {
                        "question": "What command allows you to view the status of jobs in the Slurm queue?",
                        "options": [
                                    "sview",
                                    "squeue",
                                    "sinfo",
                                    "sstat"
                        ],
                        "correct": 1,
                        "explanation": "The 'squeue' command lists the jobs currently running or waiting in the Slurm scheduling queue."
            },
            {
                        "question": "If you submit a job by mistake, how do you stop it in Slurm?",
                        "options": [
                                    "kill -9",
                                    "scancel <jobid>",
                                    "sstop <jobid>",
                                    "srm <jobid>"
                        ],
                        "correct": 1,
                        "explanation": "The 'scancel' command followed by the job ID will terminate a running or pending job."
            },
            {
                        "question": "What is 'Fairshare' scheduling?",
                        "options": [
                                    "A policy that gives all users exactly equal CPU time every day.",
                                    "An algorithm that adjusts job priority based on a user's historical resource usage compared to their allocated share.",
                                    "A system that shares memory between nodes.",
                                    "A licensing agreement for HPC software."
                        ],
                        "correct": 1,
                        "explanation": "Fairshare ensures long-term fairness. If a user has recently consumed a lot of resources, their priority drops, allowing users who haven't run jobs recently to move up the queue."
            },
            {
                        "question": "What is the purpose of 'Backfill' scheduling?",
                        "options": [
                                    "To fill empty hard drive space with random data.",
                                    "To allow smaller, shorter jobs to run immediately in the gaps left while the system waits for resources to free up for a massive job.",
                                    "To restart failed jobs automatically.",
                                    "To copy data from compute nodes back to the head node."
                        ],
                        "correct": 1,
                        "explanation": "Backfill drastically improves cluster utilization by fitting small jobs into idle nodes, provided they will finish before the nodes are needed for the next high-priority large job."
            },
            {
                        "question": "Why must users accurately estimate the Wall Time (`--time`) for their jobs?",
                        "options": [
                                    "If they underestimate, the job is killed; if they overestimate, it may delay backfill scheduling.",
                                    "Because Slurm charges them real money per hour.",
                                    "Because the CPU clock speed depends on the wall time.",
                                    "Because Slurm will randomly pause the job."
                        ],
                        "correct": 0,
                        "explanation": "Slurm strictly enforces the time limit (killing jobs that exceed it), but overestimating prevents the backfill scheduler from fitting the job into gaps, leaving it pending longer."
            },
            {
                        "question": "What does the `sinfo` command display?",
                        "options": [
                                    "Information about the user's account.",
                                    "The status and configuration of nodes and partitions in the cluster.",
                                    "The memory usage of a running job.",
                                    "The version of Slurm installed."
                        ],
                        "correct": 1,
                        "explanation": "The 'sinfo' command gives a high-level view of cluster state, showing which nodes are allocated, idle, or down, grouped by partition."
            },
            {
                        "question": "What does the '#SBATCH' directive do in a script?",
                        "options": [
                                    "It is a comment ignored by Slurm.",
                                    "It instructs the bash shell to execute the line.",
                                    "It provides resource requests and configuration flags to the Slurm scheduler.",
                                    "It defines a variable in Python."
                        ],
                        "correct": 2,
                        "explanation": "Slurm parses lines starting with #SBATCH to understand how many nodes, cores, and hours the job requires."
            },
            {
                        "question": "What does a node state of 'drain' indicate in Slurm?",
                        "options": [
                                    "The node is actively running jobs.",
                                    "The node is physically leaking coolant.",
                                    "The node is marked to accept no new jobs, usually pending maintenance or investigation of a hardware issue.",
                                    "The node is booting up."
                        ],
                        "correct": 2,
                        "explanation": "Draining a node prevents Slurm from scheduling new jobs on it, allowing current jobs to finish so the node can be safely taken offline."
            },
            {
                        "question": "What is the role of the `slurmctld` daemon?",
                        "options": [
                                    "It runs on compute nodes to launch tasks.",
                                    "It is the central controller running on the head node that manages state, queues, and allocations.",
                                    "It manages the database backend.",
                                    "It provides a web interface for users."
                        ],
                        "correct": 1,
                        "explanation": "The slurmctld (Slurm Control Daemon) is the brain of Slurm, managing the entire cluster's scheduling and state."
            },
            {
                        "question": "What is the role of the `slurmd` daemon?",
                        "options": [
                                    "It runs on compute nodes, awaiting instructions from the controller to launch tasks and monitor resources.",
                                    "It is the central controller.",
                                    "It generates billing reports.",
                                    "It provisions the operating system."
                        ],
                        "correct": 0,
                        "explanation": "slurmd runs on every compute node, acting as the worker daemon that executes tasks assigned by slurmctld."
            },
            {
                        "question": "What is 'Exclusive' allocation in Slurm?",
                        "options": [
                                    "A job that requires a special license to run.",
                                    "A job that is granted entire compute nodes, preventing any other user's jobs from sharing those nodes.",
                                    "A job that runs only on weekends.",
                                    "A job that uses all nodes in the cluster."
                        ],
                        "correct": 1,
                        "explanation": "Exclusive mode gives a job dedicated access to whole nodes, preventing performance interference from other users' processes."
            }
];

        let score = 0;
        let answeredQuestions = 0;

        const quizContainer = document.getElementById('quiz-container');

        questions.forEach((q, index) => {
            const qDiv = document.createElement('div');
            qDiv.className = 'bg-white dark:bg-slate-900/80 p-6 md:p-8 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800 space-y-4';
            
            let optionsHtml = '';
            q.options.forEach((opt, optIndex) => {
                optionsHtml += `
                    <button class="option-btn w-full text-left p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/40 hover:border-sky-500 dark:hover:border-sky-500 hover:bg-sky-50/50 dark:hover:bg-sky-950/20 text-slate-800 dark:text-slate-200 font-medium text-sm transition-all duration-200 flex items-center justify-between" 
                            onclick="checkAnswer(${index}, ${optIndex}, this)">
                        <span>${opt}</span>
                        <span class="status-icon ml-3 flex-shrink-0"></span>
                    </button>
                `;
            });

            qDiv.innerHTML = `
                <div class="flex items-start space-x-3">
                    <span class="px-3 py-1 rounded-lg bg-sky-500/10 text-sky-500 font-black text-xs border border-sky-500/30">Q${index + 1}</span>
                    <h3 class="text-base md:text-lg font-bold text-slate-900 dark:text-white m-0 leading-snug">${q.question}</h3>
                </div>
                <div class="options-container space-y-3 pt-2" id="options-${index}">
                    ${optionsHtml}
                </div>
                <div id="explanation-${index}" class="explanation hidden mt-4 p-4 rounded-xl bg-amber-500/10 border border-amber-500/30 text-slate-700 dark:text-slate-300 text-xs leading-relaxed">
                    <strong class="text-amber-500 block mb-1">Explanation:</strong>
                    ${q.explanation}
                </div>
            `;
            quizContainer.appendChild(qDiv);
        });

        function checkAnswer(questionIndex, selectedOptionIndex, buttonElement) {
            const container = document.getElementById(`options-${questionIndex}`);
            if (container.classList.contains('answered')) return;
            
            container.classList.add('answered');
            const buttons = container.getElementsByTagName('button');
            const correctIndex = questions[questionIndex].correct;

            if (selectedOptionIndex === correctIndex) {
                buttonElement.classList.add('bg-emerald-500/20', 'border-emerald-500', 'text-emerald-400');
                buttonElement.querySelector('.status-icon').innerHTML = '<svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
                score++;
            } else {
                buttonElement.classList.add('bg-rose-500/20', 'border-rose-500', 'text-rose-400');
                buttonElement.querySelector('.status-icon').innerHTML = '<svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
                
                buttons[correctIndex].classList.add('bg-emerald-500/20', 'border-emerald-500', 'text-emerald-400');
                buttons[correctIndex].querySelector('.status-icon').innerHTML = '<svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
            }

            for (let btn of buttons) {
                btn.style.cursor = 'default';
            }

            document.getElementById(`explanation-${questionIndex}`).classList.remove('hidden');
            
            answeredQuestions++;
            if (answeredQuestions === questions.length) {
                setTimeout(showResults, 800);
            }
        }

        function showResults() {
            document.getElementById('results-container').classList.remove('hidden');
            document.getElementById('score-display').textContent = score;
            document.getElementById('total-display').textContent = questions.length;
            document.getElementById('results-container').scrollIntoView({ behavior: 'smooth' });
        }
    </script>

    <!-- Footer -->
    <footer class="text-center text-slate-500 dark:text-slate-400 text-xs py-8 mt-12 border-t border-slate-200 dark:border-slate-800">
        Vaal University of Technology · Department of Electrical Engineering - Computer Systems Engineering · EIOPS4A 2026
