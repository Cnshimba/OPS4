<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 10 Quiz: System Design and Networking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#002F6E',
                        secondary: '#c9984a',
                    }
                }
            }
        }
    </script>
    <style>
        .option-btn {
            transition: all 0.2s ease;
        }
        .option-btn.selected {
            background-color: #002F6E;
            color: white;
            border-color: #002F6E;
        }
        .option-btn.correct {
            background-color: #10b981;
            color: white;
            border-color: #10b981;
        }
        .option-btn.wrong {
            background-color: #ef4444;
            color: white;
            border-color: #ef4444;
        }
        .explanation {
            display: none;
        }
        .explanation.show {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 min-h-screen pt-12 pb-24 transition-colors duration-300">

    <div class="max-w-3xl mx-auto px-4">
        
        <div class="mb-8 flex items-center justify-between">
            <div>
                <a href="Week_10_Student_Notes.html" class="text-primary dark:text-sky-400 hover:underline flex items-center mb-4">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    Back to Notes
                </a>
                <h1 class="text-3xl font-bold text-slate-900 dark:text-white">Week 10 Quiz</h1>
                <p class="text-slate-500 dark:text-slate-400 mt-2">Test your understanding of System Design and Networking</p>
            </div>
            <div class="w-16 h-16 rounded-full bg-primary flex items-center justify-center shadow-lg border-2 border-secondary">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
            </div>
        </div>

        <div id="quiz-container" class="space-y-8">
            <!-- Questions will be injected here via JS -->
        </div>

        <div id="results-container" class="hidden mt-12 p-8 bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 text-center">
            <h2 class="text-3xl font-bold mb-4">Quiz Complete!</h2>
            <p class="text-xl mb-6">You scored <span id="score-display" class="font-bold text-primary dark:text-sky-400">0</span> out of <span id="total-display">0</span>.</p>
            <button onclick="location.reload()" class="px-6 py-3 bg-secondary text-white font-bold rounded-lg hover:bg-yellow-600 transition-colors">
                Retry Quiz
            </button>
        </div>

    </div>

    <script>
        const questions = [
            {
                        "question": "Which of the following scientific domains primarily uses OpenFOAM?",
                        "options": [
                                    "Bioinformatics",
                                    "Computational Fluid Dynamics (CFD)",
                                    "Electronic Design Automation (EDA)",
                                    "Cyber Security"
                        ],
                        "correct": 1,
                        "explanation": "OpenFOAM is the premier open-source toolbox for simulating fluid flows and solving Navier-Stokes equations."
            },
            {
                        "question": "Why does CFD require an extremely low-latency network like InfiniBand?",
                        "options": [
                                    "To download data from the internet.",
                                    "Because it uses Domain Decomposition, meaning nodes must constantly exchange boundary data.",
                                    "Because the output files are small.",
                                    "Because it runs exclusively on GPUs."
                        ],
                        "correct": 1,
                        "explanation": "CFD is tightly coupled. If the network is slow, nodes waste CPU cycles waiting for adjacent boundary data."
            },
            {
                        "question": "In Bioinformatics, what is the primary function of BLAST?",
                        "options": [
                                    "To simulate weather.",
                                    "To compare unknown genetic sequences against massive databases to find matches.",
                                    "To perform crash simulations.",
                                    "To crack passwords."
                        ],
                        "correct": 1,
                        "explanation": "BLAST is used to find regions of similarity between biological sequences."
            },
            {
                        "question": "What is the hardware profile of a node designed for de novo Genome Assembly (Bioinformatics)?",
                        "options": [
                                    "Massive GPU density.",
                                    "A 'Fat Node' with massive amounts of RAM (1TB to 4TB+).",
                                    "A node with thousands of network interfaces.",
                                    "A node with a slow CPU."
                        ],
                        "correct": 1,
                        "explanation": "De novo genome assembly requires holding massive sequence graphs entirely in memory."
            },
            {
                        "question": "Which hardware component provides the most significant performance boost for Molecular Dynamics (MD) simulations like GROMACS?",
                        "options": [
                                    "High-capacity HDDs.",
                                    "GPUs (Accelerators).",
                                    "Faster Ethernet.",
                                    "More CPU RAM."
                        ],
                        "correct": 1,
                        "explanation": "Calculating inter-atomic forces is highly repetitive, making GPUs the dominant hardware for MD."
            },
            {
                        "question": "What does WRF (Weather Research and Forecasting) require due to its long simulation run times?",
                        "options": [
                                    "Massive high-speed storage for frequent Checkpointing.",
                                    "No storage at all.",
                                    "Single-core processors.",
                                    "Quantum networking."
                        ],
                        "correct": 0,
                        "explanation": "WRF runs for a long time and must dump its exact state (checkpointing) to massive, fast storage arrays to prevent data loss."
            },
            {
                        "question": "What is the role of 'Burst Buffers' in Deep Learning training on HPC clusters?",
                        "options": [
                                    "To slow down the GPUs.",
                                    "To act as an ultra-fast NVMe flash storage layer that feeds training data to the GPUs.",
                                    "To cool the processors.",
                                    "To encrypt network traffic."
                        ],
                        "correct": 1,
                        "explanation": "Standard hard drives cannot read training data fast enough, causing GPUs to starve. Burst buffers solve this I/O bottleneck."
            },
            {
                        "question": "In structural engineering, what type of software is LS-DYNA?",
                        "options": [
                                    "A genome sequencer.",
                                    "A Finite Element Analysis (FEA) tool used for crash simulations.",
                                    "A network sniffer.",
                                    "A password cracker."
                        ],
                        "correct": 1,
                        "explanation": "LS-DYNA simulates how materials deform and break upon impact by breaking them into a finite element mesh."
            },
            {
                        "question": "How does the workload profile of FEA (Crash Simulation) differ from CFD (Fluid Dynamics)?",
                        "options": [
                                    "FEA requires less CPU power.",
                                    "FEA does not use MPI.",
                                    "FEA meshes become highly distorted during a crash, requiring complex dynamic load balancing across the cluster.",
                                    "FEA uses only GPUs."
                        ],
                        "correct": 2,
                        "explanation": "Because a car chassis crumples, the computational load shifts dramatically, requiring advanced dynamic load balancing."
            },
            {
                        "question": "What is the primary HPC hardware requirement for password cracking software like Hashcat?",
                        "options": [
                                    "Massive RAM.",
                                    "High-speed InfiniBand.",
                                    "Extreme GPU Density (e.g., 8 to 10 GPUs per node).",
                                    "Large hard drives."
                        ],
                        "correct": 2,
                        "explanation": "Brute-forcing hashes is an embarrassingly parallel mathematical task that maps perfectly to the thousands of ALUs on GPUs."
            },
            {
                        "question": "Why is password cracking considered an 'Embarrassingly Parallel' workload?",
                        "options": [
                                    "Because the user forgot their password.",
                                    "Because no nodes need to talk to each other; they independently try different combinations without communication.",
                                    "Because it requires InfiniBand.",
                                    "Because it uses MPI."
                        ],
                        "correct": 1,
                        "explanation": "The tasks are completely independent, requiring zero node-to-node communication."
            },
            {
                        "question": "In Computer Systems Engineering, what does EDA stand for?",
                        "options": [
                                    "Electronic Design Automation",
                                    "Engineering Data Analytics",
                                    "Encrypted Data Array",
                                    "Extended Domain Analysis"
                        ],
                        "correct": 0,
                        "explanation": "EDA tools are used to simulate the electrical logic and timing of silicon chips before fabrication."
            },
            {
                        "question": "Why are Electronic Design Automation (EDA) workloads difficult to parallelize across multiple nodes?",
                        "options": [
                                    "Because they are open-source.",
                                    "Because a chip's logic is highly interconnected, so splitting it across a network causes massive latency.",
                                    "Because they only run on Windows.",
                                    "Because they don't require much CPU."
                        ],
                        "correct": 1,
                        "explanation": "Unlike fluids, silicon logic is heavily interdependent. EDA workloads generally require Scale-Up 'Fat Nodes' rather than Scale-Out clusters."
            },
            {
                        "question": "Which workload is heavily reliant on 'Scale-Up' (Single massive server) rather than 'Scale-Out' (Many smaller servers)?",
                        "options": [
                                    "Password Cracking (Hashcat)",
                                    "Electronic Design Automation (EDA)",
                                    "Molecular Dynamics (MD)",
                                    "Web Scraping"
                        ],
                        "correct": 1,
                        "explanation": "EDA requires massive RAM and high single-thread performance on a single machine due to the difficulty of parallelizing logic simulation."
            },
            {
                        "question": "Why is 'one size fits all' a poor philosophy when building a supercomputer?",
                        "options": [
                                    "Because different scientific domains have fundamentally conflicting hardware requirements (e.g., EDA needs RAM, Cyber needs GPUs, CFD needs InfiniBand).",
                                    "Because all software is identical.",
                                    "Because computers are too expensive.",
                                    "Because it is required by law."
                        ],
                        "correct": 0,
                        "explanation": "An HPC architect must understand the specific scientific workload before buying hardware, as optimizing for one domain often penalizes another."
            }
];

        let score = 0;
        let answeredQuestions = 0;

        const quizContainer = document.getElementById('quiz-container');

        questions.forEach((q, index) => {
            const qDiv = document.createElement('div');
            qDiv.className = 'bg-white dark:bg-slate-800 p-6 md:p-8 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700';
            
            let optionsHtml = '';
            q.options.forEach((opt, optIndex) => {
                optionsHtml += `
                    <button class="option-btn w-full text-left p-4 mb-3 border-2 border-gray-200 dark:border-gray-600 rounded-lg hover:border-primary dark:hover:border-sky-400 dark:bg-slate-700/50" 
                            onclick="checkAnswer(${index}, ${optIndex}, this)">
                        ${opt}
                    </button>
                `;
            });

            qDiv.innerHTML = `
                <h3 class="text-xl font-bold mb-4 text-slate-800 dark:text-white"><span class="text-primary dark:text-sky-400 mr-2">Q${index + 1}.</span>${q.question}</h3>
                <div class="options-container" id="options-${index}">
                    ${optionsHtml}
                </div>
                <div id="explanation-${index}" class="explanation mt-6 p-4 bg-gray-50 dark:bg-slate-900 border-l-4 border-primary rounded-r text-sm">
                    ${q.explanation}
                </div>
            `;
            quizContainer.appendChild(qDiv);
        });

        function checkAnswer(questionIndex, selectedOptionIndex, buttonElement) {
            const container = document.getElementById(`options-${questionIndex}`);
            if (container.classList.contains('answered')) return;
            
            container.classList.add('answered');
            const buttons = container.getElementsByTagName('button');
            const correctIndex = questions[questionIndex].correct;

            if (selectedOptionIndex === correctIndex) {
                buttonElement.classList.add('correct');
                score++;
            } else {
                buttonElement.classList.add('wrong');
                buttons[correctIndex].classList.add('correct');
            }

            for (let btn of buttons) {
                btn.classList.remove('hover:border-primary');
                btn.classList.remove('dark:hover:border-sky-400');
                btn.style.cursor = 'default';
            }

            document.getElementById(`explanation-${questionIndex}`).classList.add('show');
            
            answeredQuestions++;
            if (answeredQuestions === questions.length) {
                setTimeout(showResults, 800);
            }
        }

        function showResults() {
            document.getElementById('results-container').classList.remove('hidden');
            document.getElementById('score-display').textContent = score;
            document.getElementById('total-display').textContent = questions.length;
            
            // Scroll to results
            document.getElementById('results-container').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
