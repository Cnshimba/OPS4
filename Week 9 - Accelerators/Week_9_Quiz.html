    <link rel="stylesheet" href="../css/theme_v2_modern.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        primary: '#0F172A',
                        secondary: '#38BDF8',
                        accent: '#F59E0B',
                        surface: '#1E293B'
                    }
                }
            }
        }
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('theme-toggle');
            const html = document.documentElement;
            const iconSun = document.getElementById('icon-sun');
            const iconMoon = document.getElementById('icon-moon');

            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                html.classList.add('dark');
                iconSun.classList.remove('hidden');
                iconMoon.classList.add('hidden');
            } else {
                html.classList.remove('dark');
                iconSun.classList.add('hidden');
                iconMoon.classList.remove('hidden');
            }

            themeToggle.addEventListener('click', () => {
                if (html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    localStorage.theme = 'light';
                    iconSun.classList.add('hidden');
                    iconMoon.classList.remove('hidden');
                } else {
                    html.classList.add('dark');
                    localStorage.theme = 'dark';
                    iconSun.classList.remove('hidden');
                    iconMoon.classList.add('hidden');
                }
            });
        });
    </script>
</head>
<body class="bg-slate-50 dark:bg-[#070A12] text-slate-700 dark:text-slate-300 min-h-screen pt-20 pb-24 transition-colors duration-300">

    <!-- Top Navigation Bar -->
    <nav class="fixed top-0 left-0 right-0 bg-white/80 dark:bg-[#070A12]/80 backdrop-blur-xl z-50 border-b border-slate-200 dark:border-slate-800/80 transition-colors duration-300">
        <div class="container mx-auto px-4 max-w-5xl h-16 flex items-center justify-between">
            <a href="Week_9_Student_Notes.html" class="flex items-center space-x-2 text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-sky-500 transition-colors no-underline">
                <svg class="w-4 h-4 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span>Back to Student Notes</span>
            </a>
            <div class="flex items-center space-x-4">
                <a href="../index.html" class="text-xs font-bold text-slate-600 dark:text-slate-300 hover:text-sky-500 transition-colors no-underline hidden sm:block">Course Home</a>
                <button id="theme-toggle" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/60 hover:border-amber-500/50 transition-colors">
                    <svg id="icon-sun" class="w-4 h-4 text-amber-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <svg id="icon-moon" class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>

    <!-- Main Container -->
    <main class="container mx-auto px-4 max-w-4xl">
        
        <!-- Hero Header Card -->
        <div class="flex items-stretch bg-slate-50 dark:bg-slate-800/60 rounded-2xl border border-slate-200 dark:border-slate-700/60 shadow-sm mb-8 overflow-hidden">
            <div class="w-32 flex-shrink-0 flex flex-col items-center justify-center bg-slate-100 dark:bg-slate-900 border-r border-slate-200 dark:border-slate-700/80 p-6">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-500 to-amber-600 border-2 border-sky-400 flex flex-col items-center justify-center shadow-lg shadow-amber-500/20 mb-1">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>

                <span class="text-[10px] font-black text-amber-500 uppercase tracking-widest">QUIZ 09</span>

            <div class="flex-1 flex flex-col justify-center p-6">

                <span class="text-xs font-semibold text-amber-500 mt-1">CUDA Architecture, SIMT Threads & Heterogeneous Systems</span>

        <!-- Quiz Container -->
        <div id="quiz-container" class="space-y-6">
            <!-- Questions injected via JS -->
        </div>

        <!-- Results Card Container -->
        <div id="results-container" class="hidden mt-10 p-8 bg-gradient-to-r from-slate-900 to-indigo-950 text-white rounded-3xl shadow-2xl border border-sky-500/30 text-center space-y-6">
            <h2 class="text-3xl font-black text-white m-0">Quiz Complete!</h2>
            <p class="text-lg text-slate-300 m-0">You scored <span id="score-display" class="font-black text-sky-400 text-2xl">0</span> out of <span id="total-display" class="font-bold text-white text-2xl">0</span>.</p>
            <button onclick="location.reload()" class="px-8 py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-white font-black text-sm transition-all shadow-lg shadow-amber-500/30">
                Retry Quiz

    </main>

    <script>
        const questions = [
            {
                        "question": "What is the fundamental architectural difference between a CPU and a GPU?",
                        "options": [
                                    "CPUs are designed for high throughput; GPUs are designed for low latency.",
                                    "CPUs optimize for low-latency sequential execution using complex logic; GPUs optimize for massive throughput using thousands of simple cores.",
                                    "CPUs use memory; GPUs do not.",
                                    "There is no difference; they are interchangeable."
                        ],
                        "correct": 1,
                        "explanation": "CPUs use a few large, complex cores with deep caches to execute single threads very fast. GPUs use thousands of tiny cores to execute thousands of threads simultaneously."
            },
            {
                        "question": "What does CUDA stand for, and what is it?",
                        "options": [
                                    "Compute Unified Device Architecture; NVIDIA's parallel computing platform and programming model.",
                                    "Central Unit for Data Analysis; a new type of processor.",
                                    "Computer Understanding of Deep Algorithms; an AI software.",
                                    "C++ Universal Data Array; a data structure."
                        ],
                        "correct": 0,
                        "explanation": "CUDA is the proprietary software layer and API created by NVIDIA that allows developers to write C/C++ code that executes directly on NVIDIA GPUs."
            },
            {
                        "question": "In NVIDIA architecture, what is an SM (Streaming Multiprocessor)?",
                        "options": [
                                    "A video streaming card.",
                                    "The core building block of a GPU, containing a group of CUDA cores, shared memory, and schedulers.",
                                    "The main CPU of the host machine.",
                                    "A network interface."
                        ],
                        "correct": 1,
                        "explanation": "A GPU is made up of multiple SMs. Each SM operates somewhat independently, scheduling and executing blocks of threads on its own set of internal cores."
            },
            {
                        "question": "What is a 'Warp' in CUDA terminology?",
                        "options": [
                                    "A bug that crashes the GPU.",
                                    "A group of 32 threads that are executed simultaneously in lockstep on an SM.",
                                    "A memory leak.",
                                    "A physical cable connecting two GPUs."
                        ],
                        "correct": 1,
                        "explanation": "NVIDIA GPUs group threads into Warps of 32. All 32 threads in a warp must execute the exact same instruction at the same time (SIMT architecture)."
            },
            {
                        "question": "What happens if threads within the same Warp take different paths in an `if-else` statement (Warp Divergence)?",
                        "options": [
                                    "The GPU crashes.",
                                    "The SM must execute each branch sequentially, disabling the threads not on the current branch, which severely degrades performance.",
                                    "The GPU automatically spawns a new SM.",
                                    "Nothing, it runs at full speed."
                        ],
                        "correct": 1,
                        "explanation": "Because a Warp shares a single instruction fetch unit, divergent branches force the hardware to serialize the execution of the `if` and the `else`, halving performance."
            },
            {
                        "question": "What is the difference between 'Host' and 'Device' in GPU programming?",
                        "options": [
                                    "Host is the network; Device is the hard drive.",
                                    "Host is the user; Device is the software.",
                                    "Host refers to the CPU and its memory; Device refers to the GPU and its memory.",
                                    "Host is the GPU; Device is the CPU."
                        ],
                        "correct": 2,
                        "explanation": "In heterogeneous computing, the Host (CPU) orchestrates the program and offloads heavy parallel tasks to the Device (GPU)."
            },
            {
                        "question": "What is typically the most significant bottleneck in GPU-accelerated applications?",
                        "options": [
                                    "The clock speed of the GPU.",
                                    "Transferring data back and forth between the Host memory and Device memory over the PCIe bus.",
                                    "The size of the L1 cache.",
                                    "The speed of the monitor."
                        ],
                        "correct": 1,
                        "explanation": "The PCIe bus is vastly slower than the GPU's internal memory bandwidth. If an application constantly copies data to/from the GPU, it will lose all performance gains."
            },
            {
                        "question": "What is 'Shared Memory' on a GPU?",
                        "options": [
                                    "Memory shared with other users on the internet.",
                                    "A very fast, user-managed scratchpad memory located on the SM, shared among all threads in a Block.",
                                    "The main VRAM of the GPU.",
                                    "Memory shared over the PCIe bus."
                        ],
                        "correct": 1,
                        "explanation": "Shared memory is an explicit, on-chip cache. Threads in a block can use it to cooperate and share data locally at speeds much faster than reaching out to global VRAM."
            },
            {
                        "question": "In CUDA, what is a 'Thread Block'?",
                        "options": [
                                    "A firewall rule.",
                                    "A logical grouping of threads that execute together on the same SM and can synchronize and share memory.",
                                    "A physical chunk of silicon.",
                                    "A section of the hard drive."
                        ],
                        "correct": 1,
                        "explanation": "When you launch a GPU kernel, you organize millions of threads into Blocks. The GPU hardware schedules each entire Block onto a single SM."
            },
            {
                        "question": "What is OpenACC?",
                        "options": [
                                    "An open-source GPU manufacturer.",
                                    "A directive-based programming model (like OpenMP) that allows developers to add pragmas to C/Fortran code to automatically offload loops to the GPU.",
                                    "A database management system.",
                                    "A Linux kernel module."
                        ],
                        "correct": 1,
                        "explanation": "OpenACC (and OpenMP offloading) provides a higher-level, easier alternative to writing raw CUDA code, letting the compiler handle the complex GPU memory management and threading."
            },
            {
                        "question": "What does SIMT stand for?",
                        "options": [
                                    "Single Instruction, Multiple Threads",
                                    "System Integrated Memory Transfer",
                                    "Synchronous Iteration, Multiple Tasks",
                                    "Shared Internet Multi-Tenancy"
                        ],
                        "correct": 0,
                        "explanation": "SIMT (Single Instruction, Multiple Threads) is NVIDIA's term for their architecture, where a single instruction is broadcast to multiple threads (a Warp) executing on different data."
            },
            {
                        "question": "What is 'Occupancy' in GPU profiling?",
                        "options": [
                                    "The physical space the GPU takes in the rack.",
                                    "The ratio of active warps on an SM to the maximum possible number of active warps.",
                                    "The percentage of hard drive used.",
                                    "The number of users logged in."
                        ],
                        "correct": 1,
                        "explanation": "High occupancy means the SM has plenty of warps to switch between when one warp stalls (e.g., waiting for memory), allowing the GPU to hide latency effectively."
            },
            {
                        "question": "What is the advantage of CUDA 'Unified Memory'?",
                        "options": [
                                    "It makes the GPU run faster.",
                                    "It creates a single virtual memory space accessible by both the CPU and GPU, automatically migrating data pages on demand without explicit copy commands.",
                                    "It combines the RAM of multiple compute nodes.",
                                    "It prevents race conditions."
                        ],
                        "correct": 1,
                        "explanation": "Unified Memory simplifies programming by eliminating the need to write complex `cudaMemcpy` commands; the driver moves data across the PCIe bus behind the scenes."
            },
            {
                        "question": "What is NVLink?",
                        "options": [
                                    "A website for downloading drivers.",
                                    "A proprietary high-speed interconnect developed by NVIDIA that allows GPUs to communicate directly with each other much faster than PCIe.",
                                    "A type of fiber optic cable.",
                                    "A programming language."
                        ],
                        "correct": 1,
                        "explanation": "NVLink provides massive bandwidth (hundreds of GB/s) directly between multiple GPUs within a node, bypassing the CPU and PCIe bottleneck for multi-GPU training."
            },
            {
                        "question": "What are Tensor Cores?",
                        "options": [
                                    "Cores that stretch the silicon.",
                                    "Specialized execution units on modern GPUs specifically designed to dramatically accelerate mixed-precision matrix multiply-accumulate operations used in Deep Learning.",
                                    "The main power supply of the GPU.",
                                    "Software libraries for text analysis."
                        ],
                        "correct": 1,
                        "explanation": "Unlike standard CUDA cores that do generalized math, Tensor Cores perform large matrix operations (like 4x4 matrix multiplication) in a single clock cycle, fueling the AI boom."
            }
];

        let score = 0;
        let answeredQuestions = 0;

        const quizContainer = document.getElementById('quiz-container');

        questions.forEach((q, index) => {
            const qDiv = document.createElement('div');
            qDiv.className = 'bg-white dark:bg-slate-900/80 p-6 md:p-8 rounded-3xl shadow-xl border border-slate-200 dark:border-slate-800 space-y-4';
            
            let optionsHtml = '';
            q.options.forEach((opt, optIndex) => {
                optionsHtml += `
                    <button class="option-btn w-full text-left p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/40 hover:border-sky-500 dark:hover:border-sky-500 hover:bg-sky-50/50 dark:hover:bg-sky-950/20 text-slate-800 dark:text-slate-200 font-medium text-sm transition-all duration-200 flex items-center justify-between" 
                            onclick="checkAnswer(${index}, ${optIndex}, this)">
                        <span>${opt}</span>
                        <span class="status-icon ml-3 flex-shrink-0"></span>
                    </button>
                `;
            });

            qDiv.innerHTML = `
                <div class="flex items-start space-x-3">
                    <span class="px-3 py-1 rounded-lg bg-sky-500/10 text-sky-500 font-black text-xs border border-sky-500/30">Q${index + 1}</span>
                    <h3 class="text-base md:text-lg font-bold text-slate-900 dark:text-white m-0 leading-snug">${q.question}</h3>
                </div>
                <div class="options-container space-y-3 pt-2" id="options-${index}">
                    ${optionsHtml}
                </div>
                <div id="explanation-${index}" class="explanation hidden mt-4 p-4 rounded-xl bg-amber-500/10 border border-amber-500/30 text-slate-700 dark:text-slate-300 text-xs leading-relaxed">
                    <strong class="text-amber-500 block mb-1">Explanation:</strong>
                    ${q.explanation}
                </div>
            `;
            quizContainer.appendChild(qDiv);
        });

        function checkAnswer(questionIndex, selectedOptionIndex, buttonElement) {
            const container = document.getElementById(`options-${questionIndex}`);
            if (container.classList.contains('answered')) return;
            
            container.classList.add('answered');
            const buttons = container.getElementsByTagName('button');
            const correctIndex = questions[questionIndex].correct;

            if (selectedOptionIndex === correctIndex) {
                buttonElement.classList.add('bg-emerald-500/20', 'border-emerald-500', 'text-emerald-400');
                buttonElement.querySelector('.status-icon').innerHTML = '<svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
                score++;
            } else {
                buttonElement.classList.add('bg-rose-500/20', 'border-rose-500', 'text-rose-400');
                buttonElement.querySelector('.status-icon').innerHTML = '<svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
                
                buttons[correctIndex].classList.add('bg-emerald-500/20', 'border-emerald-500', 'text-emerald-400');
                buttons[correctIndex].querySelector('.status-icon').innerHTML = '<svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
            }

            for (let btn of buttons) {
                btn.style.cursor = 'default';
            }

            document.getElementById(`explanation-${questionIndex}`).classList.remove('hidden');
            
            answeredQuestions++;
            if (answeredQuestions === questions.length) {
                setTimeout(showResults, 800);
            }
        }

        function showResults() {
            document.getElementById('results-container').classList.remove('hidden');
            document.getElementById('score-display').textContent = score;
            document.getElementById('total-display').textContent = questions.length;
            document.getElementById('results-container').scrollIntoView({ behavior: 'smooth' });
        }
    </script>

    <!-- Footer -->
    <footer class="text-center text-slate-500 dark:text-slate-400 text-xs py-8 mt-12 border-t border-slate-200 dark:border-slate-800">
        Vaal University of Technology · Department of Electrical Engineering - Computer Systems Engineering · EIOPS4A 2026
    </footer>
